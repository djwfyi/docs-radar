name: Weekly Docs Radar Build & Deploy

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:    # Adds a manual "Run workflow" button in GitHub UI
  push:
    branches: [main]

permissions:
  contents: write       # Needed to commit updated data/signals.json
  pages: write          # Needed to deploy to GitHub Pages
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  gather-and-build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.170.1 # Match your local `hugo version` output
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests dnspython

      - name: Run Signal Collector
        env:
          GITHUB_TOKEN: ${{ secrets.SEARCH_PAT || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_signals.py

      - name: Commit updated signals data
        run: |
          git config --global user.name "DocsRadar Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add data/signals.json
          git diff --staged --quiet || git commit -m "chore: update weekly docs signals"
          git push

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Hugo site
        run: hugo --minify --cacheDir /tmp/hugo_cache

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: gather-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
